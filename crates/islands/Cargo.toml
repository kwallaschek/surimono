[package]
name = "surimono-islands"
description = "Island runner and built-in chart renderers (ECharts, Vega, Vega-Lite) for surimono."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["echarts", "vega"]
## The built-in `echarts` renderer: Apache ECharts 6.1.0, SVG server-side rendering.
echarts = []
## The built-in `vega` and `vega-lite` renderers: Vega 6.4.0 and Vega-Lite 6.5.0, headless view to SVG.
vega = []

[dependencies]
surimono-core.workspace = true
surimono-gfx.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Parses rendered SVG in the renderer tests.
roxmltree.workspace = true
# Checks bundles/SHA256SUMS.
sha2 = "=0.10.9"
# Counts live heap bytes in the soak test.
stats_alloc = "=0.1.10"

[lints]
workspace = true
