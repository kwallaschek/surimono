# cargo-about configuration for THIRD_PARTY_LICENSES.txt, the notices shipped
# with the Ruby gem's native library; scripts/ci/third-party-licenses.sh
# generates it from the gem extension's dependency graph. (No CLI artifact
# ships it yet; the CLI links the same MPL-2.0 crates.)
# The accepted licences match deny.toml: permissive ones for every crate, and
# MPL-2.0 only per crate, for the Servo style crates named at the end
# (unmodified dependencies from crates.io; see docs/DECISIONS.md).
#
# That list names exactly the MPL-2.0 crates the shipped library links: those
# reached through normal dependencies on the targets below. deny.toml's
# exceptions also cover crates reached only through dev-dependencies (Stylo,
# through blitz in tests), which are not shipped and stay out of this file, so
# cargo-about's "config found for a crate not present in the graph" warning
# always means something. check-mpl.py fails the build if this list names a
# crate deny.toml doesn't allow, misses a shipped MPL-2.0 crate or names one
# that isn't shipped, or if an MPL-2.0 crate comes from anywhere but crates.io.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The platforms native gems are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts, proc macros' build helpers and test-only crates are not in
# the shipped library.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# MPL-2.0, per crate: the shipped ones (a subset of deny.toml's exceptions).
[cssparser]
accepted = ["MPL-2.0"]

["cssparser-macros"]
accepted = ["MPL-2.0"]

["dtoa-short"]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]
