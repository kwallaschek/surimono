# cargo-about configuration for THIRD_PARTY_LICENSES.txt (the notices shipped
# with the Ruby gem). Generated by scripts/ci/third-party-licenses.sh.
# The accepted licences match deny.toml: permissive ones for every crate, and
# MPL-2.0 only for the Servo style crates named at the end (unmodified
# dependencies from crates.io; see docs/DECISIONS.md). check-mpl.py fails the
# build if that list differs from deny.toml's exceptions or an MPL-2.0 crate
# comes from anywhere but crates.io.
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
]
# The platforms native gems are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts, proc macros' build helpers and test-only crates are not in
# the shipped library.
ignore-build-dependencies = true
ignore-dev-dependencies = true

# MPL-2.0, per crate (the same list as deny.toml [licenses] exceptions).
[app_units]
accepted = ["MPL-2.0"]

[cssparser]
accepted = ["MPL-2.0"]

["cssparser-macros"]
accepted = ["MPL-2.0"]

["dtoa-short"]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

[stylo]
accepted = ["MPL-2.0"]

[stylo_atoms]
accepted = ["MPL-2.0"]

[stylo_config]
accepted = ["MPL-2.0"]

[stylo_derive]
accepted = ["MPL-2.0"]

[stylo_dom]
accepted = ["MPL-2.0"]

[stylo_static_prefs]
accepted = ["MPL-2.0"]

[stylo_traits]
accepted = ["MPL-2.0"]

[to_shmem]
accepted = ["MPL-2.0"]

[to_shmem_derive]
accepted = ["MPL-2.0"]

[uluru]
accepted = ["MPL-2.0"]
