# cargo-about configuration for THIRD_PARTY_LICENSES.txt (the notices shipped
# with the Ruby gem). Generated by scripts/ci/third-party-licenses.sh.
# The accepted licences match deny.toml: permissive ones, plus MPL-2.0 for the
# Servo style crates (unmodified dependencies; see docs/DECISIONS.md).
accepted = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "BSL-1.0",
    "CC0-1.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
]
# The platforms native gems are built for.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
# Build scripts, proc macros' build helpers and test-only crates are not in
# the shipped library.
ignore-build-dependencies = true
ignore-dev-dependencies = true
