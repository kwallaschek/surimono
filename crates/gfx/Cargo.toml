[package]
name = "surimono-gfx"
description = "Text metrics, Canvas2D recorder and SVG output for surimono."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde.workspace = true
# Text layout: the exact Parley that blitz-dom 0.2.4 (and so fulgur 0.40.0)
# shapes with, so measured advances equal printed ones. `std` only: no system
# fonts are ever compiled in from this crate.
parley = { version = "=0.6.0", default-features = false, features = ["std"] }
# Outlines and font metrics, the same skrifa version Parley 0.6.0 uses.
skrifa = { version = "=0.37.0", default-features = false, features = ["std"] }
# SVG sanitizing: a strict XML parser that reports byte ranges, so everything
# we don't rewrite is copied byte for byte. No dependencies of its own.
# Byte positions (the `positions` feature, on by default) are what sanitize_svg edits by.
roxmltree.workspace = true

[dev-dependencies]
serde_json.workspace = true
# Checks the reference fonts are byte-identical to the ones Chrome measured.
sha2 = { version = "=0.10.9", default-features = false }
# Only to prove measured text equals what Blitz (and so fulgur) lays out.
blitz-dom.workspace = true
blitz-html.workspace = true
blitz-traits.workspace = true

[lints]
workspace = true
