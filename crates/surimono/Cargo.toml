[package]
name = "surimono"
description = "Run a document's JavaScript without a browser, so browserless HTML-to-PDF engines can print it."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "../../README.md"
keywords.workspace = true
categories.workspace = true

[features]
default = ["echarts", "vega"]
## The built-in `echarts` renderer: Apache ECharts 6.1.0 in its server-side
## SVG mode (about 1 MB of JavaScript in the binary). On by default.
echarts = ["surimono-islands/echarts"]
## The built-in `vega` and `vega-lite` renderers: Vega 6.4.0 and Vega-Lite
## 6.5.0, headless view to SVG. On by default.
vega = ["surimono-islands/vega"]

[dependencies]
surimono-core.workspace = true
surimono-dom.workspace = true
surimono-gfx.workspace = true
# The workspace entry has default features off; the facade picks the islands
# crate's features itself (see [features]).
surimono-islands.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
# HTML pre-pass. BSD-3-Clause; shares cssparser 0.35 and selectors 0.32 (MPL-2.0,
# fenced in deny.toml) with Stylo. Held at 2.7.0 to keep that sharing: 2.7.1 and
# later move to cssparser 0.36 and selectors 0.33, a second copy of each next to
# Stylo's. Exact pin; moves to the workspace root.
lol_html = "=2.7.0"
# HTML named character references (the standard's table), for decoding marker
# attributes. MIT OR Apache-2.0; already in the tree through blitz-html 0.2.
# Exact pin; moves to the workspace root.
web_atoms = "=0.1.3"

# Tokenizes the CSS a page hands a printer (src/print.rs). Same version as
# surimono-dom's and stylo's.
cssparser = "=0.35.0"
# Checks URLs resolve as blitz-dom will (src/print.rs). Same version as
# surimono-dom's.
url = "=2.5.8"

[dev-dependencies]
# tests/breakout.rs parses the facade's output with html5ever, through
# blitz-html as fulgur does, to check islands stay in their box.
blitz-dom.workspace = true
blitz-html.workspace = true
# tests/fork.rs forks (fork, waitpid, waitid, kill, _exit). MIT OR Apache-2.0.
libc.workspace = true
# tests/page_soak.rs counts live heap bytes, as crates/islands' soak test does.
stats_alloc = "=0.1.10"

[lints]
workspace = true
