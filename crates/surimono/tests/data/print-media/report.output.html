<!doctype html><html lang="en"><head><meta charset="utf-8"><title>report</title>
<style>
@page { size: 210mm 297mm; margin: 15mm; }
html, body { margin: 0; }
body { font: 14px/20px "Noto Sans"; color: #1f2328; }
nav { background: #24292f; color: #fff; padding: 8px 12px; margin-bottom: 12px; }
nav a { color: #fff; margin-right: 12px; }
.page { width: 900px; margin: 0 auto; }
.toolbar button { font: inherit; padding: 4px 10px; }
h1 { font-size: 22px; line-height: 28px; margin: 0 0 12px; }
table { border-collapse: collapse; width: 100%; }
td, th { border-bottom: 1px solid #d0d7de; padding: 4px 6px; text-align: left; }
.print-only { display: none; }
@media not all { .page { width: 600px; } }
@media all {
  nav, .toolbar { display: none; }
  .page { width: auto; }
  .print-only { display: block; color: #57606a; font-size: 12px; }
  a::after { content: " (" attr(href) ")"; }
  h1 { color: #0a3069; border-bottom: 2px solid #0a3069; }
}
</style>
<style media="not all">/* media: not all */</style>
<style media="all">table { font-size: 12px; } th { background: #eaeef2; }</style>
