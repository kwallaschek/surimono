# Chrome reference renders for the visual fixtures, with a pinned Playwright
# Chromium. They are the outside truth for how a page looks and are never edited
# by hand. The work is in scripts/ci/reference.sh and fixtures/tools/.
name: reference

on:
  push:
    branches: [main]
    paths: ["fixtures/**", "scripts/ci/reference.sh"]
  schedule:
    - cron: "30 17 * * 0" # Mondays 02:30 JST
  workflow_dispatch:

# Read-only for every job but publish (below).
permissions:
  contents: read

jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: scripts/ci/job.sh reference scripts/ci/reference.sh
      # Logs and result for the publish job; this job has no write token.
      - if: always()
        run: scripts/ci/job-status.sh "${{ job.status }}"
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ci-out-chrome
          path: ci-out
          retention-days: 3

  # The only job with a write token. After the others (whatever their result),
  # it pushes their logs and results to the ci-results branch, for the fleet,
  # which can read git but not the Actions API. It runs the default branch's
  # scripts on the build jobs' artifacts, so no code under test runs where the
  # token is.
  publish:
    needs: [chrome]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: ci-out-*
          path: results
      - run: scripts/ci/publish-results.sh --from results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
