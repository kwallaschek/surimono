# Phase 2: libraries that run as page scripts, not as islands. Each is vendored
# unmodified under fixtures/real-world/lib/<name>-<version>/ (test-only, never
# compiled in), and its page is a fixture next to this manifest. [[library.vendored]]
# pins every vendored file: `member` is its path in the library's tarball, or in
# `source_tarball` when that is set; a file with no tarball source says why in
# `written_here`. verify.py checks the committed copy offline and the tarball's
# copy online. [library.license_pending] names a licence file that isn't here
# yet, and the task for it; verify.py --release fails while one is open.

