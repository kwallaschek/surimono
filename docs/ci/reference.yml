# Chrome reference renders for the visual fixtures, with a pinned Playwright
# Chromium. They are the outside truth for how a page looks and are never edited
# by hand. The work is in scripts/ci/reference.sh and fixtures/tools/.
name: reference

on:
  push:
    branches: [main]
    paths: ["fixtures/**", "scripts/ci/reference.sh"]
  schedule:
    - cron: "30 17 * * 0" # Mondays 02:30 JST
  workflow_dispatch:

permissions:
  contents: write # publish renders to the ci-results branch

jobs:
  chrome:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - run: scripts/ci/job.sh reference scripts/ci/reference.sh
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"
        env:
          # The only step that gets the write token (checkout keeps none).
          GITHUB_TOKEN: ${{ github.token }}
