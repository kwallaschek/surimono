# main, nightly and release branches: macOS, aarch64 Linux, Ruby 3.2 to 4.0,
# precompiled native gems, the soak test and AddressSanitizer. Not on pull
# requests, so PR feedback stays fast. Each job only calls a script in scripts/ci/.
name: full

on:
  push:
    branches: [main, "release/**"]
  schedule:
    - cron: "0 17 * * *" # 02:00 JST
  workflow_dispatch:

concurrency:
  group: full-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish logs to the ci-results branch

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      MATRIX_KEY: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/job.sh test-${{ matrix.os }} scripts/ci/test.sh
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"

  ruby:
    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      MATRIX_KEY: ruby-${{ matrix.ruby }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
          working-directory: bindings/ruby
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/job.sh ruby-${{ matrix.ruby }} scripts/ci/ruby.sh
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"

  native-gems:
    strategy:
      fail-fast: false
      matrix:
        platform: [x86_64-linux, aarch64-linux, x86_64-darwin, arm64-darwin]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MATRIX_KEY: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: bindings/ruby
      - run: scripts/ci/job.sh gem-${{ matrix.platform }} scripts/ci/native-gem.sh ${{ matrix.platform }}
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: gem-${{ matrix.platform }}
          path: bindings/ruby/pkg/*.gem
          retention-days: 14
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"

  linux-extra:
    strategy:
      fail-fast: false
      matrix:
        check: [soak, asan, nightly-extra]
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MATRIX_KEY: ${{ matrix.check }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.check }}
      - run: scripts/ci/job.sh ${{ matrix.check }} scripts/ci/${{ matrix.check }}.sh
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"
