# Test fonts shared by Chrome (via @font-face in fixtures) and by surimono and
# fulgur (via the font registry), so measured and printed text use the same
# glyphs. Never replace a file without updating its sha256 and size here;
# `python3 fixtures/fonts/verify.py` checks them.
#
# Noto Sans is the unhinted static build (hinting is irrelevant for vector PDF
# output and only adds rasteriser variance). Noto Sans JP is the static
# region-subset OTF (CFF outlines) from noto-cjk, about 4.5 MB per weight.
# All four are SIL OFL 1.1; see OFL.txt.

[[font]]
file = "NotoSans-Regular.ttf"
family = "Noto Sans"
weight = 400
style = "normal"
format = "truetype"
version = "2.015"
sha256 = "f3961a9cde016d41a4879aecda1474d3a36d6bf54fa0e4643de029cc2248b0e8"
bytes = 431364
license = "OFL-1.1"
license_file = "OFL.txt"
source_repo = "https://github.com/notofonts/notofonts.github.io"
source_commit = "412a7edb2c8c535d1066157e5b17e661fd5591fe"
source_url = "https://raw.githubusercontent.com/notofonts/notofonts.github.io/412a7edb2c8c535d1066157e5b17e661fd5591fe/fonts/NotoSans/unhinted/ttf/NotoSans-Regular.ttf"

