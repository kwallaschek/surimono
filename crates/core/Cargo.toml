[package]
name = "surimono-core"
description = "QuickJS sandbox, event loop, virtual clock and resource limits for surimono."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
rquickjs = { workspace = true, features = ["allocator"] }
thiserror.workspace = true

[build-dependencies]
# build.rs hashes the vendored engine sources for the bytecode fingerprint.
sha2.workspace = true

# Thread stack bounds, for the stack-size check (engine.rs).
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

# Runs as the process's main thread, which libtest never uses.
[[test]]
name = "main_thread_stack"
harness = false
