# A neutrality case (fixtures/README.md, "Neutrality cases"): surimono's printer-safe
# output must print in Chromium as this page does.
title = "enc-short-emptied"
what = '''A short page with no <meta charset> whose screen <style> holds non-ASCII text (p::before { content: "日本" }), which the output empties: the page keeps its rewrites (#207, blocking finding 3, fixed by keeping a page whose two outputs both have non-ASCII bytes). Read as UTF-8 the output prints as the page; served as text/html with no charset the page itself is mojibake'''
from = "The review of #207 (Q-PKG-10), round one, finding 3: page review-207-w/p3/short-emptied.html"
changed = '''Fixture fonts only: @font-face rules for Noto Sans and Noto Sans JP and html { font-family: Noto Sans, Noto Sans JP } put first in the first <style> without a media attribute, and the page's own families ("L", "JP", which were system fonts or fonts/ next to the page) replaced by them, so the print needs no system font'''
links = []
resources = []
printer_safe = "media"
loads = ["http", "file", "http-no-charset"]
page_charset.http = "UTF-8"
page_charset.file = "UTF-8"
page_charset.http-no-charset = "windows-1252"
mojibake = ["http-no-charset"]
