# The Grover benchmark: time and peak memory, Grover (Chrome) against surimono and
# fulgur, on the reference report. Every speed or memory claim in the README comes
# from here. The work is in scripts/ci/bench.sh and bench/.
name: bench

on:
  push:
    branches: [main, "release/**"]
    paths: ["crates/**", "bench/**", "Cargo.lock", "scripts/ci/bench.sh"]
  schedule:
    - cron: "15 18 * * *" # 03:15 JST
  workflow_dispatch:

# Read-only for every job but publish (below).
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  grover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      # bench/rust is its own workspace on its own toolchain (1.97.0, for
      # fulgur's krilla); rust-cache reads its metadata, so install it first.
      - run: cd bench/rust && rustup toolchain install
      # Both workspaces: bench/rust's Cargo.lock and toolchain join the cache
      # key, and its target dir (target/bench-rust, see scripts/ci/bench.sh;
      # the path after -> is relative to the workspace) is saved, so fulgur's
      # dependencies aren't rebuilt on every run.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: |
            . -> target
            bench/rust -> ../../target/bench-rust
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - run: scripts/ci/job.sh bench scripts/ci/bench.sh
      # Logs and result for the publish job; this job has no write token.
      - if: always()
        run: scripts/ci/job-status.sh "${{ job.status }}"
      - if: always()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: ci-out-grover
          path: ci-out
          retention-days: 3

  # The only job with a write token. After the others (whatever their result),
  # it pushes their logs and results to the ci-results branch, for the fleet,
  # which can read git but not the Actions API. It runs the default branch's
  # scripts on the build jobs' artifacts, so no code under test runs where the
  # token is.
  publish:
    needs: [grover]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: ci-out-*
          path: results
      - run: scripts/ci/publish-results.sh --from results
        env:
          GITHUB_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
