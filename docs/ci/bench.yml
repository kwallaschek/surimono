# The Grover benchmark: time and peak memory, Grover (Chrome) against surimono and
# fulgur, on the reference report. Every speed or memory claim in the README comes
# from here. The work is in scripts/ci/bench.sh and bench/.
name: bench

on:
  push:
    branches: [main, "release/**"]
    paths: ["crates/**", "bench/**", "Cargo.lock", "scripts/ci/bench.sh"]
  schedule:
    - cron: "15 18 * * *" # 03:15 JST
  workflow_dispatch:

permissions:
  contents: write # publish results to the ci-results branch

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target

jobs:
  grover:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "22"
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - run: scripts/ci/job.sh bench scripts/ci/bench.sh
      - if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"
        env:
          # The only step that gets the write token (checkout keeps none).
          GITHUB_TOKEN: ${{ github.token }}
