<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>unknown-at-rule</title>
<style>
@font-face { font-family: "Noto Sans"; src: url("../../fonts/NotoSans-Regular.ttf"); }
@page { size: 210mm 297mm; margin: 15mm; }
html, body { margin: 0; }
body { font: 14px/20px "Noto Sans"; color: #1f2328; }
p { display: none; margin: 0 0 6px; padding: 2px 6px; background: #e8f5ec; }
</style>
<style>@view-transition { navigation: auto; }</style>
<style>
@media print { .print { display: block } }
@media screen { .screen { display: block } }
@media not print { .not-print { display: block } }
</style>
</head>
<body>
<p class="print">print</p>
<p class="screen">screen</p>
<p class="not-print">not-print</p>
</body></html>
