# A neutrality case (fixtures/README.md, "Neutrality cases"): surimono's printer-safe
# output must print in Chromium as this page does.
title = "g-import-after-bogus-rule"
what = '''@import after p::bogus-x {} (a rule Chromium drops, which still ends the import prelude): the import is ignored, so it counts as read. Chromium prints no sheet text for this page, so a rewrite of the sheets' own text can't show in its print. By print the case still guards the direction in which print media is resolved (a CLI that swaps all and not all in the output fails it, #213's review), and by printer_safe = "media" the gate's reach (a gate that turned strict again fails it there).'''
from = "#209 (Q-PKG-08), the engineer's measured page b-imp-after-bogus.html"
changed = '''Fixture fonts only: @font-face rules for Noto Sans and html { font-family: Noto Sans } put first in the first <style> without a media or title attribute, on a line of their own (so a sheet shown with white-space: pre still shows the page's own text at the start of a line), and monospace replaced by Noto Sans, so the print needs no system font'''
links = ["show.css"]
resources = []
printer_safe = "media"
