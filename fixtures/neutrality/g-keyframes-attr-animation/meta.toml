# A neutrality case (fixtures/README.md, "Neutrality cases"): surimono's printer-safe
# output must print in Chromium as this page does.
title = "g-keyframes-attr-animation"
what = '''@keyframes k { display: block } with the animation declared only in a style attribute on a <p>: rules in @keyframes match nothing unless an animation property is declared somewhere, and here one is, so the reader counts them. In Chromium the keyframe's display: block shows nothing (see g-keyframes-paused). Chromium prints no sheet text for this page, so a rewrite of the sheets' own text can't show in its print. By print the case still guards the direction in which print media is resolved (a CLI that swaps all and not all in the output fails it, #213's review), and by printer_safe = "media" the gate's reach (a gate that turned strict again fails it there).'''
from = "#209 (Q-PKG-08), the engineer's measured page a-kf-attr-anim.html"
changed = '''Fixture fonts only: @font-face rules for Noto Sans and html { font-family: Noto Sans } put first in the first <style> without a media or title attribute, on a line of their own (so a sheet shown with white-space: pre still shows the page's own text at the start of a line), and monospace replaced by Noto Sans, so the print needs no system font'''
links = []
resources = []
printer_safe = "media"
