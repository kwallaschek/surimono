# A neutrality case (fixtures/README.md, "Neutrality cases"): surimono's printer-safe
# output must print in Chromium as this page does.
title = "enc-q-quot"
what = '''<meta http-equiv="content-type" content='text/html; charset="utf-8"'> (the output writes the quotes as &quot;, which the prescan reads as the tree does) and 売上 near the end of the detector's 262,144 bytes: the meta declares UTF-8, so the page is rewritten and decodes as UTF-8 in every load (#207, round two)'''
from = "The review of #207 (Q-PKG-10), round two: page review-207-w/r2new/q-quot.html"
changed = '''Fixture fonts only: @font-face rules for Noto Sans and Noto Sans JP and html { font-family: Noto Sans, Noto Sans JP } put first in the first <style> without a media attribute, and the page's own families ("L", "JP", which were system fonts or fonts/ next to the page) replaced by them, so the print needs no system font; p:nth-last-of-type(2) { display: none } hides the 261 KB filler paragraph, and the filler is shortened by as many bytes as the fonts and that rule added, so 売上 stays at byte 262,088'''
links = []
resources = []
printer_safe = "media"
loads = ["http", "file", "http-no-charset"]
page_charset.http = "UTF-8"
page_charset.file = "UTF-8"
page_charset.http-no-charset = "UTF-8"
