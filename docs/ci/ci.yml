# Every pull request and push to main, Linux: fmt, clippy (warnings are errors),
# tests, cargo-deny. The checks themselves live in scripts/ci.sh so they can change
# without touching this file. Logs go to the ci-results branch.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # publish logs to the ci-results branch

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"
  CARGO_TARGET_DIR: target
  PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: ruby/setup-ruby@de492cf36cbab201753d720ce4f4e336cd688c94 # v1.336.0
        with:
          ruby-version: "3.4"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: taiki-e/install-action@68a389c788b2cd04016ce8c80ee23b80d2ab3d68 # v2.88.1
        with:
          tool: cargo-deny
      - name: checks
        run: scripts/ci/job.sh linux scripts/ci.sh
      - name: publish results
        if: always()
        run: scripts/ci/publish-results.sh "${{ job.status }}"
        env:
          # The only step that gets the write token (checkout keeps none).
          GITHUB_TOKEN: ${{ github.token }}
