# The WPT slices surimono is measured on (docs/SPEC.md, Targets). `commit` is the
# pinned web-platform-tests revision: the one wpt.fyi's stable Chrome run of
# 2026-11-03 used (Chrome 156.0.8078.80, run 5143154416943104), so Chrome's own
# results at this revision can be looked up.
# wpt/tools/vendor.py copies from a checkout at exactly this commit.

schema = 1
source = "https://github.com/web-platform-tests/wpt"
commit = "8b4b06ff53a47f1041e0e59f894d9e929963904c"
# A file above this size is left out and listed in the manifest (no big assets).
max_file_bytes = 262144
# Not tests, and named by no <script src>: files and folders that pages load in
# frames, or name in strings. Each file comes with its WPT path and hash.
support = [
  "common/blank.html",
  "common/dummy.xhtml",
  "common/dummy.xml",
  "dom/nodes/Document-createElement-namespace-tests",
  "dom/nodes/Element-getElementsByTagName-change-document-HTMLNess-iframe.xml",
  "dom/nodes/Node-isEqualNode-iframe1.xml",
  "dom/nodes/Node-isEqualNode-iframe2.xml",
  "dom/nodes/Node-parentNode-iframe.html",
  "dom/nodes/ParentNode-querySelector-All-content.html",
  "dom/nodes/ParentNode-querySelector-All-content.xht",
  "dom/nodes/getElementsByClassNameFrame.htm",
  "domparsing/resources/domparser-iframe.html",
]

# What wpt.fyi's run above passes on the manifest's URLs, per area. Not a
# denominator: compat.py prints each rate on this count next to the rate on
# wpt/baseline/chrome.json, which can only be shorter (wpt/README.md, "Baseline").
[wpt_fyi]
run = "5143154416943104"
chrome = "156.0.8078.80"
[wpt_fyi.chrome_passes]
"html/webappapis timers and microtask queuing" = 34
"dom/nodes" = 15300
"dom/events" = 848
"domparsing" = 913

[[slice]]
id = "timers"
area = "html/webappapis timers and microtask queuing"
paths = ["html/webappapis/timers"]
phase = 2
target = 90

[[slice]]
id = "microtask-queuing"
area = "html/webappapis timers and microtask queuing"
paths = ["html/webappapis/microtask-queuing"]
phase = 2
target = 90

[[slice]]
id = "dom-nodes"
area = "dom/nodes"
paths = ["dom/nodes"]
phase = 2
target = 70

[[slice]]
id = "dom-events"
area = "dom/events"
paths = ["dom/events"]
phase = 2
target = 70

[[slice]]
id = "domparsing"
area = "domparsing"
paths = ["domparsing"]
phase = 2
target = 60
