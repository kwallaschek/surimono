# Real-world library suite: the pinned versions of libraries people actually
# put in documents. Phase 1 covers the island renderers. Every entry is an npm
# release, pinned by version, tarball URL and the registry's integrity hash
# (sha512, Subresource Integrity format).
#
# Two builds of each library are recorded, because they are not the same file:
# - dist_file: the package's own prebuilt bundle, with its sha256. The Chrome
#   harness (fixtures/tools, same versions in its package.json) loads it to draw
#   the references.
# - [library.embedded]: what crates/islands actually compiles in, built from the
#   same npm package by its own build script, with that file's sha256. Recorded
#   once the renderer exists; until then the entry says so.
#
# `python3 -I fixtures/real-world/verify.py` downloads each tarball and checks
# the npm side, and checks the embedded file's sha256 when it is in the checkout.
#
# bundled_licenses lists the licences of third-party code compiled into the
# bundle (not the npm package's CLI-only dependencies).

schema = 1
phase = 1

